name: Morning Briefing

on:
  schedule:
    # Kept as a free backup trigger, but GitHub's own `schedule` event is
    # documented as best-effort and was observed firing only once across
    # several hours on this repo (vs. many manual runs) -- it cannot be
    # relied on alone. The real trigger is an external cron service
    # pinging workflow_dispatch (see README/CLAUDE.md for setup); this
    # hourly cron just means a free, no-setup fallback still exists on
    # top of that.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force a send right now, bypassing the hour/already-sent gate"
        type: boolean
        default: false

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Pause/resume/timezone/time state lives on a separate orphan branch
      # (briefing-state), cloned into its own subdirectory -- never checked
      # out into the main job, so the automation never touches this repo's
      # real commit history.
      - name: Fetch pause state branch
        run: |
          git clone --depth 1 --branch briefing-state \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            state-branch

      # Never invokes headless Claude -- processes any new Telegram
      # commands (stop/continue/timezone/time), then decides SEND or SKIP
      # based on paused state + whether it's currently at/past the
      # configured send time (and not already sent today) in the
      # effective timezone. FORCE_SEND only fires when a manual
      # workflow_dispatch run explicitly checks the "force" input --
      # NOT for every dispatch. This matters because an external cron
      # pinger (see README/CLAUDE.md) also triggers via plain
      # workflow_dispatch, every few minutes, and must go through the
      # same hour/already-sent gate as a real scheduled run would --
      # otherwise every single ping would force-send immediately.
      # Pause is still respected either way.
      - name: Check pause/resume state
        id: check_pause
        run: |
          status=$(python tools/manage_pause_state.py state-branch/briefing_state.json)
          echo "status=$status" >> "$GITHUB_OUTPUT"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOME_TIMEZONE: Europe/Zurich
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force == 'true' && '1' || '0' }}

      # Only commits/pushes if the state file actually changed -- most
      # hourly runs this is a no-op. Runs on the briefing-state branch's
      # own checkout, every run regardless of SEND/SKIP, so a command sent
      # between sends is always recorded promptly.
      - name: Commit updated state
        run: |
          cd state-branch
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add briefing_state.json
            git commit -m "Update briefing control state"
            git push origin briefing-state
          fi

      - uses: actions/setup-node@v4
        if: steps.check_pause.outputs.status == 'SEND'
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        if: steps.check_pause.outputs.status == 'SEND'
        # Pinned to a known-working version (matches local dev) rather than
        # trusting "latest" -- a CI run with an older/unpinned install once
        # failed here with "unknown option '--permission-prompts'".
        run: npm install -g @anthropic-ai/claude-code@2.1.318

      - name: Write Google OAuth credentials
        if: steps.check_pause.outputs.status == 'SEND'
        run: |
          echo "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          echo "$GOOGLE_TOKEN_JSON" > token.json
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}

      - name: Send morning briefing
        if: steps.check_pause.outputs.status == 'SEND'
        run: python tools/send_morning_briefing.py state-branch/briefing_state.json
        env:
          LOCATION_NAME: Zurich
          LAT: "0.0000"
          LON: "0.0000"
          HOME_TIMEZONE: Europe/Zurich
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # The "Send morning briefing" step above updates last_sent_date in
      # state-branch/briefing_state.json on success -- commit that too.
      - name: Commit send record
        if: steps.check_pause.outputs.status == 'SEND'
        run: |
          cd state-branch
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add briefing_state.json
            git commit -m "Record today's briefing send"
            git push origin briefing-state
          fi
